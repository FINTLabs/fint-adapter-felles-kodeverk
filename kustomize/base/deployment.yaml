apiVersion: apps/v1
kind: Deployment
metadata:
  name: adapter-felles-kodeverk
spec:
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: adapter-felles-kodeverk
  template:
    metadata:
      labels:
        app: adapter-felles-kodeverk
    spec:
      restartPolicy: Always
      containers:
      - name: adapter-felles-kodeverk
        image: fintlabsacr.azurecr.io/adapter-felles-kodeverk:build.14
        resources:
          limits:
            memory: "1000M"
            cpu: "150m"
          requests:
            memory: "477M"
            cpu: "150m"
        ports:
          - containerPort: 8091
        readinessProbe:
          httpGet:
            path: /health
            port: 8091
          initialDelaySeconds: 60
          timeoutSeconds: 5
        env:
          - name: TZ
            value: Europe/Oslo
          - name: JAVA_TOOL_OPTIONS
            value: '-XX:+ExitOnOutOfMemoryError -Xmx800M -verbose:gc'
          - name: springfox.title
            value: "Felles kodeverk Adapter"
          - name: fint.adapter.organizations
            value: fintlabs.no
          - name: fint.oauth.enabled
            value: "true"
          - name: fint.oauth.access-token-uri
            value: https://idp.felleskomponent.no/nidp/oauth/nam/token
          - name: fint.oauth.scope
            value: fint-client
          - name: fint.oauth.client-id
            valueFrom:
              secretKeyRef:
                key: client-id
                name: fake-adapter
          - name: fint.oauth.client-secret
            valueFrom:
              secretKeyRef:
                key: client-secret
                name: fake-adapter
          - name: fint.oauth.username
            valueFrom:
              secretKeyRef:
                key: username
                name: fake-adapter
          - name: fint.oauth.password
            valueFrom:
              secretKeyRef:
                key: password
                name: fake-adapter
          # - name: fint.adapter.ssb-klass.valid-to
          #   value: "2017-12-31"
          - name: fint.adapter.ssb-klass.interval
            value: "7200000"
          - name: fint.adapter.ssb-klass.root-url
            value: "https://data.ssb.no/api/klass/v1/classifications"
